<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icons/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&family=Racing+Sans+One&display=swap" rel="stylesheet">

    <main class="card">
        <div class="card__hero-avatar-wrapper">
            <div class="avatar-glow"></div>

        <p class="card__subtitle" data-i18n="subtitle">15 • ESFJ • Future Entrepreneur</p>

            <ul>
                <li><button class="card__tab active" data-tab="info" data-i18n="infoTab">Info</button></li>
                <li><button class="card__tab" data-tab="social" data-i18n="socialTab">Social</button></li>
            </ul>
        </nav>

        <div class="card__content" id="content">
            <div id="info" class="tab-content active">
                <div class="about-text" id="about-text"></div>
            </div>

            <div id="social" class="tab-content">
                <div class="social-grid">
                    <a href="https://x.com/OwenPersik" class="social-tile" target="_blank">
                        <i class="fa-brands fa-x-twitter"></i>
                        <span>@OwenPersik</span>
                    </a>
                    <a href="https://discord.com/users/971809780475756584" class="social-tile" target="_blank">
                        <i class="fa-brands fa-discord"></i>
                        <span>o.pers</span>
                    </a>
                    <a href="https://steamcommunity.com/id/owenpers/" class="social-tile" target="_blank">
                        <i class="fa-brands fa-steam"></i>
                        <span>сryoffear雨</span>
                    </a>
                    <a href="https://t.me/owpers" class="social-tile" target="_blank">
                        <i class="fa-brands fa-telegram"></i>
                        <span>@owpers</span>
                    </a>
                </div>

        </div>
    </main>

    <footer class="footer">
        <p class="footer__copyright" data-i18n="footer">© 2026 Owen Yaku Pers. All Rights Reserved.</p>
    </footer>

</html>
