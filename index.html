<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <title>Owen Yaku Pers</title>
</head>
<body>

    <!-- ============ LOADER ============ -->
    <div id="loader" class="loader">
        <div class="loader__content">
            <div class="title-font text-3xl tracking-widest">OWEN YAKU PERS</div>
            <div class="loader__line"></div>
            <p class="loader__text">INITIALIZING</p>
        </div>
    </div>

    <!-- ============ PARTICLES BACKGROUND ============ -->
    <div class="particles" id="particles"></div>

    <!-- ============ MAIN CARD CONTAINER ============ -->
    <main class="main">
        <div id="main-card" class="card">
            
            <!-- ============ HERO SECTION (AVATAR & STATUS) ============ -->
            <div class="card__hero">
                <div class="avatar-wrapper">
                    <img src="img/icons/avatar.jpg" alt="Owen Yaku Pers" class="avatar">
                    <div id="status-badge" class="status-badge"></div>
                </div>
                <h1 class="card__name">Owen Yaku Pers</h1>
                <p class="card__subtitle">16 • ESFJ </p>
            </div>

            <!-- ============ ABOUT SECTION ============ -->
            <div class="card__about">
                <p id="about-text" class="about-text"></p>
            </div>

            <!-- ============ SOCIAL LINKS SECTION ============ -->
            <div class="card__social">
                <div class="section-title">STAY CONNECTED</div>
                <div class="social-grid">
                    <a href="https://x.com/OwenPersik" target="_blank" class="social-tile">
                        <i class="fa-brands fa-x-twitter"></i>
                        <div>
                            <div class="social-tile__name">OwenPersik</div>
                            <div class="social-tile__platform"></div>
                        </div>
                    </a>
                    <a href="https://discord.com/users/971809780475756584" target="_blank" class="social-tile">
                        <i class="fa-brands fa-discord"></i>
                        <div>
                            <div class="social-tile__name">o.pers</div>
                            <div class="social-tile__platform"></div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- ============ FOOTER SECTION ============ -->
            <footer class="card__footer">
                <div class="footer__left">
                    <span id="footer-text" class="footer__copyright"></span>
                    <span class="footer__separator">•</span>
                    <a href="privacy.html" class="footer__link">Privacy</a>
                </div>
                <button id="magic-btn" class="magic-button">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>MAKE MAGIC</span>
                </button>
            </footer>
        </div>
    </main>

    <!-- ============ SCRIPTS ============ -->
    <script src="script.js"></script>
</body>
</html>
